name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Code Hardening & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (Ruff)
        run: ruff check .

      - name: Run type checker (MyPy)
        run: mypy src

      - name: Run test suite (Pytest)
        run: pytest -v

  deploy:
    name: Production Deployment & Zero-Downtime Rollback
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production host via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'madhu' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" 'bash -e -s' << 'EOF'
            set -euo pipefail

            # Ensure deployment root exists and is initialized
            mkdir -p /opt/televault
            cd /opt/televault

            if [ ! -d ".git" ]; then
              echo "Initializing git repository in /opt/televault..."
              git init
              git remote add origin https://github.com/madhu2456/TelegramFilesDownloader.git || true
            fi
            git remote set-url origin https://github.com/madhu2456/TelegramFilesDownloader.git 2>/dev/null || git remote add origin https://github.com/madhu2456/TelegramFilesDownloader.git

            # Resolve current commit safely (empty if initial deployment)
            PREV_SHA=$(git rev-parse --verify HEAD 2>/dev/null || echo "")
            if [ -n "$PREV_SHA" ]; then
              echo "Current deployed commit: $PREV_SHA"
              echo "Backing up current container image for instant rollback..."
              docker tag televault:latest televault:rollback-backup 2>/dev/null || true
            else
              echo "Initial deployment: no prior HEAD commit found."
            fi

            echo "Syncing latest repository changes from main branch..."
            git fetch origin main
            git checkout -f -B main origin/main
            git reset --hard origin/main
            git clean -fd
            NEW_SHA=$(git rev-parse HEAD)
            echo "Updated to commit: $NEW_SHA"

            echo "Pre-creating host state directories..."
            mkdir -p session data out && chmod 700 session data out

            echo "Building and launching TeleVault container stack..."
            if ! (docker compose build --pull && docker compose up -d --remove-orphans); then
              echo "Error: Docker compose startup failed. Rolling back..."
              if [ -n "$PREV_SHA" ]; then
                echo "Rolling back to previous commit: $PREV_SHA"
                git reset --hard "$PREV_SHA"
                docker tag televault:rollback-backup televault:latest 2>/dev/null || true
                docker compose up -d --no-build || docker compose up -d --build
              else
                echo "Initial deployment failure. No previous commit to rollback to."
              fi
              exit 1
            fi

            echo "Polling health check endpoint on http://127.0.0.1:8200/api/health (max 30s)..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8200/api/health | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                echo "TeleVault health check passed (attempt $i/30)!"
                HEALTHY=true
                break
              fi
              sleep 1
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "Health check failed after 30s! Capturing failed container diagnostics..."
              echo "=== Docker Compose Logs (Failed Container) ==="
              docker compose logs --tail=100 2>&1 || true
              echo "=== Diagnostic HTTP Probe ==="
              curl -sv http://127.0.0.1:8200/api/health 2>&1 || true

              if [ -n "$PREV_SHA" ]; then
                echo "Rolling back to previous commit $PREV_SHA..."
                git reset --hard "$PREV_SHA"
                docker tag televault:rollback-backup televault:latest 2>/dev/null || true
                docker compose up -d --no-build || docker compose up -d --build
                echo "Rollback completed to $PREV_SHA"
              else
                echo "Initial deployment failure. Stopping unhealthy containers..."
                docker compose down || true
              fi
              exit 1
            fi

            echo "TeleVault production deployment completed successfully!"
          EOF
