[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-downloader"
version = "0.5.0"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "TRY",    # tryceratops
    "PIE",    # flake8-pie
    "PYI",    # flake8-pyi
    "PLW",    # pylint warnings
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E701", "E702", "E401", "E501", "TRY003", "TRY300", "B904", "PLW0603", "SIM105", "UP017", "ASYNC240"
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC230", "ASYNC240", "S101", "PLW1510"]
"src/cli.py" = ["E402", "BLE001"]
"src/web/client_helpers.py" = ["BLE001", "S110", "S112"]
"src/web/routes_tg.py" = ["BLE001"]
"src/web/routes_direct.py" = ["BLE001"]
"src/web/routes_jobs.py" = ["BLE001"]
"src/web/security.py" = ["BLE001"]

[tool.mypy]
ignore_missing_imports = true
