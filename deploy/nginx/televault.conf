# ==============================================================================
# Nginx Configuration for TeleVault (televault.madhudadi.in)
# Reverse Proxy to TeleVault Web Dashboard (127.0.0.1:8200)
# ==============================================================================

# HTTP -> HTTPS 301 Redirect
server {
    listen 80;
    listen [::]:80;
    server_name televault.madhudadi.in;

    # Allow ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name televault.madhudadi.in;

    # SSL Certificates
    ssl_certificate /etc/ssl/madhudadi.in/fullchain.pem;
    ssl_certificate_key /etc/ssl/madhudadi.in/privkey.pem;

    # SSL Hardening & Modern Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 50M;

    # Real IP Forwarding
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 1. Unbuffered Streaming for Media and ZIP Downloads
    # Crucial for zero-disk direct browser streaming from Telegram
    location ~ ^/api/(direct|media/stream)/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;

        # Disable buffering to stream chunks instantly
        proxy_buffering off;
        proxy_request_buffering off;

        # Extended read timeout for multi-GB file downloads
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. WebSocket Live Telemetry HUD Stream
    location /ws/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection alive for 24h
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Static Assets & App Dashboard
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
